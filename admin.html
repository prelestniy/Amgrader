<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090B">
<title>Amgrader · Админка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/fonts.css?v=34">
<link rel="stylesheet" href="css/main1.css?v=34">
<link rel="stylesheet" href="css/main2.css?v=34">
<link rel="stylesheet" href="css/main3.css?v=34">
<link rel="stylesheet" href="css/main4.css?v=34">
<link rel="stylesheet" href="css/themes.css?v=34">
<link rel="stylesheet" href="css/anim.css?v=34">
<link rel="stylesheet" href="css/style.css?v=34">
<style>
  .adm-page{padding:calc(14px + var(--safe-top)) 16px calc(96px + var(--safe-bottom));min-height:100dvh}
  .adm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .adm-badge{font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 10px;border-radius:999px;background:var(--accent);color:var(--bg)}
  .adm-tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:10px 12px calc(10px + var(--safe-bottom));background:var(--surface-1);border-top:1px solid var(--border-hi);z-index:50}
  .adm-tab{flex:1;max-width:160px;border:0;background:none;color:var(--text-dim);font:inherit;font-size:12px;font-weight:700;padding:8px;border-radius:14px;cursor:pointer;transition:color .2s,background .2s,transform .15s}
  .adm-tab.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .adm-tab:active{transform:scale(.95)}
  .adm-screen{display:none;animation:admIn .35s ease both}
  .adm-screen.on{display:block}
  @keyframes admIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .adm-search{width:100%;padding:13px 14px;border-radius:var(--r-btn);border:1px solid var(--border-hi);background:var(--surface-2);color:var(--text);font:inherit;margin-bottom:12px}
  .adm-card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:var(--r-btn);background:var(--surface-2);margin-bottom:8px;cursor:pointer;animation:admIn .35s ease both;transition:transform .15s,background .2s}
  .adm-card:active{transform:scale(.98)} .adm-card:hover{background:var(--surface-3)}
  .adm-sub{font-size:12px;color:var(--text-mute);margin-top:2px}
  .adm-field{margin:12px 0 6px;font-size:12px;color:var(--text-dim)}
  .adm-input{width:100%;padding:12px 14px;border-radius:var(--r-btn);border:1px solid var(--border-hi);background:var(--surface-2);color:var(--text);font:inherit}
  .adm-row{display:flex;gap:8px}
  .adm-row>*{flex:1}
  .adm-toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-weight:700}
  .adm-toggle input{width:44px;height:26px;accent-color:var(--accent)}
  .adm-msg{min-height:20px;font-size:13px;color:var(--text-dim);margin-top:10px;text-align:center}
  .adm-scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:60}
  .adm-scrim.on{opacity:1;pointer-events:auto}
  .adm-sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface-1);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + var(--safe-bottom));transform:translateY(105%);transition:transform .38s cubic-bezier(.22,1,.36,1);z-index:70;box-shadow:0 -12px 40px rgba(0,0,0,.5)}
  .adm-sheet.on{transform:none}
  .adm-sheet-title{font-size:18px;font-weight:800;margin-bottom:4px}
  .adm-grant{font-size:12px;color:var(--text-mute)}
  .adm-empty{text-align:center;color:var(--text-dim);padding:24px 0;font-size:14px}
  .adm-gate{text-align:center;padding:60px 18px;color:var(--text-dim)}
  .adm-link{display:block;text-align:center;margin-top:16px;color:var(--accent);font-weight:700;text-decoration:none}
  .pre-chip{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--pc,var(--text))}
</style>
</head>
<body>
<div class="adm-page">
  <div class="adm-head">
    <div class="brand">Amgrader <span class="adm-badge">ADMIN</span></div>
    <a class="adm-link" style="margin:0;font-size:13px" href="/">В игру →</a>
  </div>

  <div id="gate" class="adm-gate" style="display:none">Откройте админку внутри Telegram.</div>

  <section class="adm-screen on" id="scrUsers">
    <input class="adm-search" id="q" placeholder="Поиск по нику, ID или логину" oninput="onSearch()">
    <div id="list"></div>
    <button class="ghost-btn" style="width:100%;margin-top:6px" onclick="loadUsers(false)">Ещё</button>
  </section>

  <section class="adm-screen" id="scrPre">
    <div id="preList"></div>
    <div class="pg-title" style="margin:18px 0 10px">Префикс</div>
    <input type="hidden" id="pId">
    <div class="adm-field">Текст (до 12 символов)</div>
    <input class="adm-input" id="pText" maxlength="12" placeholder="VIP">
    <div class="adm-row">
      <div><div class="adm-field">Цвет</div><input class="adm-input" id="pColor" value="#B6F24A"></div>
      <div><div class="adm-field">Цена, G</div><input class="adm-input" id="pPrice" type="number" min="0" value="0"></div>
    </div>
    <label class="adm-toggle"><span>Показывать в магазине</span><input id="pActive" type="checkbox" checked></label>
    <div class="adm-row"><button class="primary-btn" onclick="savePrefix()">Сохранить</button><button class="ghost-btn" onclick="clearPrefix()">Новый</button></div>
    <div class="adm-msg" id="pMsg"></div>
  </section>

  <section class="adm-screen" id="scrGrant">
    <div class="pg-title" style="margin-bottom:10px">Выдать</div>
    <div class="adm-field">Игрок: ID или логин</div>
    <input class="adm-input" id="gWho" placeholder="123456 или login">
    <div class="adm-row">
      <div><div class="adm-field">G</div><input class="adm-input" id="gG" type="number" min="0" value="0"></div>
      <div><div class="adm-field">Прокрутки</div><input class="adm-input" id="gSpins" type="number" min="0" value="0"></div>
    </div>
    <div class="adm-grant" style="margin-top:8px">Выдача пополняет баланс и запас прокруток.</div>
    <button class="primary-btn" style="width:100%;margin-top:14px" onclick="grant()">Выдать</button>
    <div class="adm-msg" id="gMsg"></div>
  </section>
</div>

<nav class="adm-tabs">
  <button class="adm-tab on" id="tUsers" onclick="show('users')">Игроки</button>
  <button class="adm-tab" id="tPre" onclick="show('pre')">Префиксы</button>
  <button class="adm-tab" id="tGrant" onclick="show('grant')">Выдать</button>
</nav>

<div class="adm-scrim" id="scrim" onclick="closeSheet()"></div>
<div class="adm-sheet" id="sheet"><div id="sheetBody"></div></div>

<script>
const INIT = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) || "";
if (window.Telegram && Telegram.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); }
const VERIFIED = '<svg class="vbadge" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#4FEAFF"/><polyline points="29,50 47.8,68 81,32" fill="none" stroke="#FFFFFF" stroke-width="7.2"/></svg>';
let offset = 0, qv = "", prefixes = [], cur = null, st = null;

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function api(path, opts = {}) {
  const r = await fetch(path, { method: opts.method || "GET", headers: { "Content-Type": "application/json", "X-Init-Data": INIT }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || "Ошибка");
  return j;
}
function nk(u){
  const s=u.style||{}; const pre=s.prefix?`<span class="nk-prefix" style="--pc:${esc(s.prefix.color)}">${esc(s.prefix.text)}</span>`:"";
  const col=s.nameColor?` style="color:${esc(s.nameColor)}"`:"";
  return `<span class="nk">${pre}<span class="nk-name"${col}>${esc(u.nickname||"Игрок")}</span>${u.verified?VERIFIED:""}</span>`;
}
function show(which){
  ["users","pre","grant"].forEach(k=>{
    document.getElementById(k==="users"?"scrUsers":k==="pre"?"scrPre":"scrGrant").classList.toggle("on",k===which);
    document.getElementById("t"+(k==="users"?"Users":k==="pre"?"Pre":"Grant")).classList.toggle("on",k===which);
  });
  if(which==="pre") loadPrefixes();
}
function onSearch(){ clearTimeout(st); st=setTimeout(()=>{ qv=document.getElementById("q").value.trim(); offset=0; loadUsers(true); },300); }
async function loadUsers(reset){
  const box=document.getElementById("list");
  try{
    const rows=await api(`/api/admin/users?q=${encodeURIComponent(qv)}&offset=${offset}`);
    if(reset) box.innerHTML="";
    if(reset&&!rows.length) box.innerHTML='<div class="adm-empty">Никого не нашли</div>';
    rows.forEach((u,i)=>{
      const d=document.createElement("div"); d.className="adm-card"; d.style.animationDelay=(i*0.03)+"s";
      d.innerHTML=`<div style="min-width:0"><div>${nk({nickname:u.nickname,verified:u.verified,style:{nameColor:u.nameColor,prefix:u.prefix}})}</div><div class="adm-sub">ID ${esc(u.publicId)} · ${esc(u.login||"")} · ${u.balance} G</div></div><span style="color:var(--text-mute)">›</span>`;
      d.onclick=()=>openUser(u); box.appendChild(d);
    });
    offset+=rows.length;
  }catch(e){ if(reset) box.innerHTML=`<div class="adm-empty">${esc(e.message)}</div>`; }
}
function openUser(u){
  cur=u;
  const opts=prefixes.map(p=>`<option value="${p.id}" ${u.prefixId===p.id?"selected":""}>${esc(p.text)} · ${p.price} G</option>`).join("");
  document.getElementById("sheetBody").innerHTML=`
    <div class="adm-sheet-title">${esc(u.nickname||"Игрок")}</div>
    <div class="adm-sub">ID ${esc(u.publicId)} · ${esc(u.login||"")}</div>
    <label class="adm-toggle"><span>Верифицирован</span><input id="uVer" type="checkbox" ${u.verified?"checked":""}></label>
    <div class="adm-field">Цвет ника (#RRGGBB, пусто — обычный)</div>
    <input class="adm-input" id="uColor" value="${esc(u.nameColor||"")}" placeholder="#4FEAFF">
    <div class="adm-field">Префикс</div>
    <select class="adm-input" id="uPre"><option value="">Без префикса</option>${opts}</select>
    <div class="adm-row" style="margin-top:14px"><button class="primary-btn" onclick="saveUser()">Сохранить</button><button class="ghost-btn" onclick="closeSheet()">Закрыть</button></div>
    <div class="adm-msg" id="uMsg"></div>`;
  openSheet();
}
async function saveUser(){
  const body={verified:document.getElementById("uVer").checked,nameColor:document.getElementById("uColor").value.trim()||null,prefixId:Number(document.getElementById("uPre").value)||null};
  try{ await api(`/api/admin/user/${encodeURIComponent(cur.publicId)}`,{method:"POST",body}); document.getElementById("uMsg").textContent="Сохранено ✓"; offset=0; loadUsers(true); }
  catch(e){ document.getElementById("uMsg").textContent=e.message; }
}
function openSheet(){ document.getElementById("sheet").classList.add("on"); document.getElementById("scrim").classList.add("on"); }
function closeSheet(){ document.getElementById("sheet").classList.remove("on"); document.getElementById("scrim").classList.remove("on"); }

async function loadPrefixes(){
  const box=document.getElementById("preList");
  try{
    prefixes=await api("/api/admin/prefixes");
    box.innerHTML=prefixes.map(p=>`<div class="adm-card" onclick='editPrefix(${JSON.stringify(p).replace(/'/g,"&#39;")})'><div><span class="nk-prefix" style="--pc:${esc(p.color)}">${esc(p.text)}</span> <span class="adm-sub">${p.price} G${p.active?"":" · скрыт"}</span></div><span style="color:var(--text-mute)">›</span></div>`).join("")||'<div class="adm-empty">Префиксов пока нет</div>';
  }catch(e){ box.innerHTML=`<div class="adm-empty">${esc(e.message)}</div>`; }
}
function editPrefix(p){
  document.getElementById("pId").value=p.id; document.getElementById("pText").value=p.text;
  document.getElementById("pColor").value=p.color; document.getElementById("pPrice").value=p.price;
  document.getElementById("pActive").checked=p.active; document.getElementById("pMsg").textContent="";
}
function clearPrefix(){ editPrefix({id:"",text:"",color:"#B6F24A",price:0,active:true}); }
async function savePrefix(){
  const body={id:document.getElementById("pId").value||null,text:document.getElementById("pText").value.trim(),color:document.getElementById("pColor").value.trim(),price:Number(document.getElementById("pPrice").value||0),active:document.getElementById("pActive").checked};
  try{ await api("/api/admin/prefixes",{method:"POST",body}); document.getElementById("pMsg").textContent="Сохранено ✓"; clearPrefix(); loadPrefixes(); }
  catch(e){ document.getElementById("pMsg").textContent=e.message; }
}
async function grant(){
  const body={who:document.getElementById("gWho").value.trim(),g:Number(document.getElementById("gG").value||0),spins:Number(document.getElementById("gSpins").value||0)};
  try{ const r=await api("/api/admin/grant",{method:"POST",body}); document.getElementById("gMsg").textContent=`Готово: ${r.nickname} — G +${r.g}, прокруток +${r.spins}`; }
  catch(e){ document.getElementById("gMsg").textContent=e.message; }
}

if(!INIT){ document.getElementById("gate").style.display="block"; document.getElementById("scrUsers").style.display="none"; }
else { loadUsers(true); loadPrefixes(); }
</script>
</body></html>
