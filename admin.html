<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090B">
<title>Amgrader · Админка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{--bg:#09090B;--s1:#121216;--s2:#1a1a20;--s3:#25252d;--tx:#F4F4F5;--dim:#9A9AA6;--mute:#5E5E6A;--acc:#B6F24A;--bd:rgba(255,255,255,.08);--r:18px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  .app{position:fixed;inset:0;display:flex;flex-direction:column}
  .top{flex:none;padding:calc(12px + var(--safe-t)) 16px 10px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-bottom:1px solid var(--bd)}
  .title{font-size:20px;font-weight:800;letter-spacing:.01em}
  .tag{font-size:10px;font-weight:900;letter-spacing:.08em;padding:4px 9px;border-radius:999px;background:var(--acc);color:#0A0A0B}
  .game{font-size:13px;font-weight:700;color:var(--dim);text-decoration:none;padding:8px 12px;border-radius:12px;background:var(--s2)}
  .main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 14px 18px}
  .screen{display:none;animation:in .35s cubic-bezier(.22,1,.36,1) both}
  .screen.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .bottom{flex:none;display:flex;gap:6px;padding:8px 10px calc(8px + var(--safe-b));background:var(--s1);border-top:1px solid var(--bd)}
  .tab{flex:1;border:0;background:none;color:var(--mute);padding:10px 4px;border-radius:14px;font-weight:700;font-size:12px;cursor:pointer;transition:color .2s,background .25s,transform .15s}
  .tab.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,transparent)}
  .tab:active{transform:scale(.95)}
  .search{width:100%;padding:14px 16px;border-radius:var(--r);border:1px solid var(--bd);background:var(--s2);margin-bottom:12px;outline:none;transition:border-color .2s,box-shadow .2s}
  .search:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
  .card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:var(--r);background:var(--s2);border:1px solid var(--bd);margin-bottom:9px;cursor:pointer;animation:in .35s ease both;transition:transform .15s,border-color .2s}
  .card:active{transform:scale(.98)} .card:hover{border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
  .av{width:44px;height:44px;flex:none;border-radius:14px;background:var(--s3);display:grid;place-items:center;font-weight:800;color:var(--dim);overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover}
  .info{min-width:0;flex:1}
  .sub{font-size:12px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nk{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:100%}
  .nk-name{font-weight:800}
  .nk-prefix{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;color:var(--pc,var(--tx));background:color-mix(in srgb,var(--pc,#fff) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc,#fff) 40%,transparent)}
  .vbadge{width:17px;height:17px;flex:none;display:inline-block}
  .chev{color:var(--mute);font-size:20px}
  .av img{width:100%;height:100%;object-fit:cover}
  .vbadge{width:.78em;height:.78em;flex:none;display:inline-block;vertical-align:.02em;margin-left:1px}
  .pal{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:6px}
  .pal button{aspect-ratio:1;border-radius:8px;border:2px solid transparent;cursor:pointer;padding:0}
  .pal button.on{border-color:var(--tx)}
  .empty{text-align:center;color:var(--dim);padding:40px 10px;font-size:14px}
  .lbl{font-size:12px;color:var(--dim);margin:14px 0 6px;font-weight:700}
  .inp{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--s2);outline:none;transition:border-color .2s,box-shadow .2s}
  .inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .btn{padding:14px;border-radius:14px;border:0;font-weight:800;cursor:pointer;transition:transform .15s,opacity .2s;background:var(--acc);color:#0A0A0B}
  .btn:active{transform:scale(.97)} .btn.ghost{background:var(--s3);color:var(--tx)}
  .btn:disabled{opacity:.5}
  .sw{display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-weight:700;border-bottom:1px solid var(--bd)}
  .sw input{width:46px;height:28px;accent-color:var(--acc);cursor:pointer}
  .msg{min-height:20px;font-size:13px;color:var(--dim);margin-top:12px;text-align:center}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;top:6vh;background:var(--s1);border-radius:26px 26px 0 0;display:flex;flex-direction:column;transform:translateY(104%);transition:transform .4s cubic-bezier(.22,1,.36,1);z-index:50;box-shadow:0 -14px 40px rgba(0,0,0,.55)}
  .sheet.on{transform:none}
  .sh-head{flex:none;padding:16px 18px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd)}
  .sh-title{font-size:18px;font-weight:800}
  .sh-x{width:36px;height:36px;border-radius:12px;border:0;background:var(--s3);cursor:pointer;font-size:18px}
  .sh-body{flex:1;overflow-y:auto;padding:14px 18px calc(18px + var(--safe-b));-webkit-overflow-scrolling:touch}
  .hero{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r);background:var(--s2);border:1px solid var(--bd);margin-bottom:6px}
  .hero .av{width:58px;height:58px;border-radius:18px}
  .pill{display:inline-block;font-size:12px;color:var(--dim);margin-top:4px}
  .pre-card{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--s2);border:1px solid var(--bd);margin-bottom:9px;cursor:pointer;animation:in .35s ease both}
  .pre-card:active{transform:scale(.98)}
  .off{opacity:.55}
  .palette{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:6px}
  .sw-c{aspect-ratio:1/1;border-radius:12px;border:2px solid rgba(255,255,255,.08);cursor:pointer;transition:transform .15s,box-shadow .2s;padding:0}
  .sw-c:active{transform:scale(.9)} .sw-c.on{box-shadow:0 0 0 2px var(--s1),0 0 0 4px var(--acc)}
  .cpick{width:54px;height:46px;border:0;background:none;padding:0;cursor:pointer;border-radius:12px}
  .pre-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .pre-pick{border:1px solid var(--bd);background:var(--s2);color:var(--pc,var(--tx));padding:8px 12px;border-radius:999px;font-weight:800;font-size:13px;cursor:pointer;transition:transform .15s,box-shadow .2s}
  .pre-pick:active{transform:scale(.94)} .pre-pick.on{box-shadow:0 0 0 2px var(--acc)}
  .prev-box{padding:18px;border-radius:var(--r);background:linear-gradient(160deg,var(--s2),var(--s3));border:1px solid var(--bd);text-align:center;margin-bottom:8px}
  .prev-lbl{font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
  .prev-nick{font-size:20px;display:flex;justify-content:center}
  .prev-sub{font-size:12px;color:var(--mute);margin-top:8px}
  .gate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--dim)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="row" style="align-items:center;flex:none"><span class="title">Amgrader</span><span class="tag">ADMIN</span></div>
    <a class="game" href="/">В игру</a>
  </header>

  <main class="main">
    <section class="screen on" id="sUsers">
      <input class="search" id="q" placeholder="Поиск: ник, ID или логин" oninput="onSearch()" autocomplete="off">
      <div id="list"></div>
      <div class="empty" id="listEmpty" style="display:none">Никого не нашли</div>
      <div class="row" style="margin-top:6px"><button class="btn ghost" onclick="loadUsers(false)">Загрузить ещё</button></div>
    </section>

    <section class="screen" id="sPre">
      <div id="preList"></div>
      <div class="lbl" style="margin-top:18px">Префикс: создать или изменить</div>
      <input type="hidden" id="pId">
      <input class="inp" id="pText" maxlength="24" placeholder="Текст, например VIP">
      <div class="lbl" style="margin-top:10px">Цвет префикса</div>
      <div class="pal" id="prePal"></div>
      <div class="row" style="margin-top:10px">
        <div><div class="lbl" style="margin-top:0">Цвет (#RRGGBB)</div><input class="inp" id="pColor" value="#B6F24A" oninput="markPalColor()"></div>
        <div><div class="lbl" style="margin-top:0">Цена, G</div><input class="inp" id="pPrice" type="number" min="0" value="0"></div>
      </div>
      <label class="sw" style="margin-top:12px"><span>Показывать в магазине</span><input id="pActive" type="checkbox" checked></label>
      <div class="row" style="margin-top:14px"><button class="btn" onclick="savePrefix()">Сохранить</button><button class="btn ghost" onclick="clearPrefix()">Новый</button></div>
      <button class="btn ghost" id="pDel" style="width:100%;margin-top:10px;color:#F87171;display:none" onclick="deletePrefix()">Удалить префикс</button>
      <div class="msg" id="pMsg"></div>
    </section>

    <section class="screen" id="sGrant">
      <div class="lbl" style="margin-top:0">ID игрока или логин</div>
      <input class="inp" id="gWho" placeholder="например 123456">
      <div class="row" style="margin-top:10px">
        <div><div class="lbl" style="margin-top:0">G</div><input class="inp" id="gG" type="number" min="0" value="0"></div>
        <div><div class="lbl" style="margin-top:0">Прокрутки</div><input class="inp" id="gSpins" type="number" min="0" value="0"></div>
      </div>
      <button class="btn" style="width:100%;margin-top:18px" onclick="grant()">Выдать</button>
      <div class="msg" id="gMsg"></div>
    </section>
  </main>

  <nav class="bottom">
    <button class="tab on" id="tUsers" onclick="show('users')">Игроки</button>
    <button class="tab" id="tPre" onclick="show('pre')">Префиксы</button>
    <button class="tab" id="tGrant" onclick="show('grant')">Выдать</button>
  </nav>
</div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sh-head"><span class="sh-title" id="shTitle">Игрок</span><button class="sh-x" onclick="closeSheet()">✕</button></div>
  <div class="sh-body" id="shBody"></div>
</div>
<div class="gate" id="gate">Откройте админку внутри Telegram.</div>

<script>
const INIT = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) || "";
if (window.Telegram && Telegram.WebApp) { try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch (e) {} }

/* Цвет акцента — как в игре (тема из localStorage), чтобы админка выглядела так же */
(function applyTheme() {
  const TH = { lime:"#B6F24A", blue:"#3A68B8", red:"#E5484D", orange:"#FF8A3D", yellow:"#F5C542", green:"#2FBF71",
    cyan:"#2EC4D6", violet:"#8B5CF6", pink:"#F2619B", white:"#E8E8EC", graphite:"#6B7280", brown:"#A86B3C" };
  let v = "lime";
  try { v = localStorage.getItem("amg_theme") || "lime"; } catch (e) {}
  let acc = TH[v] || (/^#[0-9a-f]{6}$/i.test(v) ? v : null);
  if (!acc && v.startsWith("c")) {
    try { const c = (JSON.parse(localStorage.getItem("amg_theme_custom") || "[]")).find(x => x.id === v); if (c) acc = c.color; } catch (e) {}
  }
  if (acc) document.documentElement.style.setProperty("--acc", acc);
})();

const VERIFIED = '<svg class="vbadge" viewBox="0 0 100 100" aria-label="Верифицирован"><circle cx="50" cy="50" r="50" fill="#4FEAFF"/><polyline points="29,50 47.8,68 81,32" fill="none" stroke="#FFFFFF" stroke-width="7.2"/></svg>';
let offset = 0, qv = "", prefixes = [], cur = null, st = null;

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function api(path, opts = {}) {
  const r = await fetch(path, { method: opts.method || "GET", headers: { "Content-Type": "application/json", "X-Init-Data": INIT }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || "Ошибка");
  return j;
}
function nk(u, pre){
  const p = u.prefix || null;
  const pr = p ? `<span class="nk-prefix" style="--pc:${esc(p.color)}">${esc(p.text)}</span>` : "";
  const col = u.nameColor ? ` style="color:${esc(u.nameColor)}"` : "";
  return `<span class="nk">${pr}<span class="nk-name"${col}>${esc(u.nickname || "Игрок")}</span>${u.verified ? VERIFIED : ""}</span>`;
}
function initials(n){ return esc((n || "?").trim().charAt(0).toUpperCase()); }

function show(which){
  const map = { users: ["sUsers","tUsers"], pre: ["sPre","tPre"], grant: ["sGrant","tGrant"] }[which];
  Object.values({users:0,pre:0,grant:0}) ;
  ["sUsers","sPre","sGrant"].forEach(id => document.getElementById(id).classList.toggle("on", id === map[0]));
  ["tUsers","tPre","tGrant"].forEach(id => document.getElementById(id).classList.toggle("on", id === map[1]));
  document.querySelector(".main").scrollTop = 0;
  if (which === "pre") loadPrefixes();
}
function onSearch(){ clearTimeout(st); st = setTimeout(() => { qv = document.getElementById("q").value.trim(); offset = 0; loadUsers(true); }, 280); }
async function loadUsers(reset){
  const box = document.getElementById("list"), empty = document.getElementById("listEmpty");
  try {
    const rows = await api(`/api/admin/users?q=${encodeURIComponent(qv)}&offset=${offset}`);
    if (reset) box.innerHTML = "";
    rows.forEach((u, i) => {
      const d = document.createElement("div");
      d.className = "card"; d.style.animationDelay = (i * 0.035) + "s";
      d.innerHTML = `<div class="av">${u.photo ? `<img src="${u.photo}" alt="">` : initials(u.nickname)}</div>
        <div class="info">${nk({ nickname: u.nickname, verified: u.verified, nameColor: u.nameColor, prefix: u.prefix })}
        <div class="sub">ID ${esc(u.publicId)} · ${esc(u.login || "—")} · ${u.balance} G</div></div><span class="chev">›</span>`;
      d.onclick = () => openUser(u); box.appendChild(d);
    });
    offset += rows.length;
    empty.style.display = (reset && !rows.length) ? "block" : "none";
  } catch (e) { if (reset) { box.innerHTML = ""; empty.style.display = "block"; empty.textContent = e.message; } }
}

const PALETTE = ["#FFFFFF","#E8E8EC","#9CA3AF","#6B7280","#111111","#000000",
  "#F87171","#EF4444","#B91C1C","#FB923C","#F97316","#C2410C","#FACC15","#EAB308","#A3E635","#84CC16",
  "#22C55E","#16A34A","#2DD4BF","#06B6D4","#4FEAFF","#38BDF8","#3B82F6","#1D4ED8","#818CF8","#8B5CF6",
  "#A855F7","#D946EF","#F472B6","#FB7185","#FCD34D","#86EFAC"];
let draft = null;
function openUser(u){
  cur = u;
  draft = { publicId: u.publicId, verified: !!u.verified, nameColor: u.nameColor || "", prefixId: u.prefixId || null };
  document.getElementById("shTitle").textContent = "Игрок";
  const sw = PALETTE.map(c => `<button class="sw-c" style="background:${c}" data-c="${c}" onclick="pickColor('${c}')" aria-label="${c}"></button>`).join("");
  const pre = [`<button class="pre-pick" data-id="" onclick="pickPrefix(null)">Без префикса</button>`]
    .concat(prefixes.map(p => `<button class="pre-pick" data-id="${p.id}" style="--pc:${esc(p.color)}" onclick="pickPrefix(${p.id})">${esc(p.text)}</button>`)).join("");
  document.getElementById("shBody").innerHTML = `
    <div class="av" style="width:64px;height:64px;margin:0 0 12px">${cur.photo ? `<img src="${cur.photo}" alt="">` : initials(cur.nickname)}</div>
    <div class="prev-box"><div class="prev-lbl">Предпросмотр</div><div id="prevNick" class="prev-nick"></div>
      <div class="prev-sub" id="prevSub"></div></div>
    <label class="sw"><span>Галочка (верифицирован)</span><input id="dVer" type="checkbox" ${draft.verified ? "checked" : ""} onchange="draft.verified=this.checked;renderPreview()"></label>
    <div class="lbl">Цвет ника</div>
    <div class="palette">${sw}</div>
    <div class="row" style="margin-top:10px;align-items:center">
      <input class="inp" id="dColor" value="${esc(draft.nameColor)}" placeholder="#RRGGBB или пусто" oninput="setColorText(this.value)">
      <input type="color" id="dColorPick" class="cpick" value="${draft.nameColor || "#ffffff"}" oninput="pickColor(this.value)">
    </div>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="pickColor('')">Сбросить цвет</button>
    <div class="lbl">Префикс</div>
    <div class="pre-row">${pre}</div>
    <div class="lbl">ID игрока (буквы любого алфавита, цифры, _ · 3–16)</div>
    <input class="inp" id="dId" value="${esc(draft.publicId)}" oninput="draft.publicId=this.value.trim()">
    <div class="row" style="margin-top:20px"><button class="btn" onclick="saveUser()">Сохранить</button><button class="btn ghost" onclick="closeSheet()">Закрыть</button></div>
<button class="btn ghost" style="width:100%;margin:10px 0" onclick="grantPrefix()">Выдать выбранный префикс игроку</button>
    <div class="msg" id="uMsg"></div>`;
  renderPreview(); markPrefix();
  openSheet();
}
function pickColor(c){
  draft.nameColor = c || "";
  const t = document.getElementById("dColor"); if (t) t.value = draft.nameColor;
  const p = document.getElementById("dColorPick"); if (p && c) p.value = c;
  document.querySelectorAll(".sw-c").forEach(b => b.classList.toggle("on", b.dataset.c === c));
  renderPreview();
}
function setColorText(v){
  v = (v || "").trim();
  if (v === "" || /^#[0-9a-fA-F]{6}$/.test(v)) { draft.nameColor = v; renderPreview(); }
}
function pickPrefix(id){ draft.prefixId = id; markPrefix(); renderPreview(); }
function markPrefix(){ document.querySelectorAll(".pre-pick").forEach(b => b.classList.toggle("on", (b.dataset.id || null) == (draft.prefixId || null))); }
function renderPreview(){
  const box = document.getElementById("prevNick"); if (!box || !draft) return;
  const p = prefixes.find(x => x.id === draft.prefixId) || null;
  const pr = p ? `<span class="nk-prefix" style="--pc:${esc(p.color)}">${esc(p.text)}</span>` : "";
  const col = draft.nameColor ? ` style="color:${esc(draft.nameColor)}"` : "";
  box.innerHTML = `<span class="nk">${pr}<span class="nk-name"${col}>${esc(cur.nickname || "Игрок")}</span>${draft.verified ? VERIFIED : ""}</span>`;
  document.getElementById("prevSub").textContent = `ID ${draft.publicId} · ${cur.login || "—"}`;
}
async function grantPrefix(){
  const msg = document.getElementById("uMsg");
  if (!draft || !draft.prefixId) { msg.textContent = "Выберите префикс в списке выше"; return; }
  try { await api(`/api/admin/user/${encodeURIComponent(cur.publicId)}`, { method: "POST", body: { grantPrefix: draft.prefixId } }); msg.textContent = "Выдано ✓"; }
  catch (e) { msg.textContent = e.message; }
}
async function saveUser(){
  const body = { publicId: draft.publicId, verified: draft.verified, nameColor: draft.nameColor || null, prefixId: draft.prefixId || null };
  const msg = document.getElementById("uMsg");
  try {
    await api(`/api/admin/user/${encodeURIComponent(cur.publicId)}`, { method: "POST", body });
    msg.textContent = "Сохранено ✓"; cur.publicId = draft.publicId; offset = 0; loadUsers(true);
  } catch (e) { msg.textContent = e.message; }
}
function openSheet(){ document.getElementById("sheet").classList.add("on"); document.getElementById("scrim").classList.add("on"); }
function closeSheet(){ document.getElementById("sheet").classList.remove("on"); document.getElementById("scrim").classList.remove("on"); }

async function loadPrefixes(){
  const box = document.getElementById("preList");
  try {
    prefixes = await api("/api/admin/prefixes");
    renderPrePal();
    box.innerHTML = prefixes.map((p, i) => `<div class="pre-card ${p.active ? "" : "off"}" style="animation-delay:${i * 0.04}s" onclick='editPrefix(${JSON.stringify(p).replace(/'/g, "&#39;")})'>
        <span class="nk-prefix" style="--pc:${esc(p.color)}">${esc(p.text)}</span>
        <span class="sub" style="margin:0">${p.price} G${p.active ? "" : " · скрыт"}</span></div>`).join("") || '<div class="empty">Префиксов пока нет</div>';
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function renderPrePal(){
  const box = document.getElementById("prePal"); if (!box) return;
  box.innerHTML = PALETTE.map(c => `<button style="background:${c}" data-c="${c}" onclick="setPrefColor('${c}')" aria-label="${c}"></button>`).join("");
  markPalColor();
}
function setPrefColor(c){ document.getElementById("pColor").value = c; markPalColor(); }
function markPalColor(){
  const v = (document.getElementById("pColor").value || "").trim().toUpperCase();
  document.querySelectorAll("#prePal button").forEach(b => b.classList.toggle("on", b.dataset.c.toUpperCase() === v));
}
async function deletePrefix(){
  const id = document.getElementById("pId").value, msg = document.getElementById("pMsg");
  if (!id || !confirm("Удалить префикс? Он снимется со всех игроков.")) return;
  try { await api("/api/admin/prefixes", { method: "POST", body: { id, delete: true } }); msg.textContent = "Удалено ✓"; clearPrefix(); loadPrefixes(); }
  catch (e) { msg.textContent = e.message; }
}
function editPrefix(p){
  document.getElementById("pDel").style.display = p.id ? "block" : "none";
  document.getElementById("pId").value = p.id; document.getElementById("pText").value = p.text;
  document.getElementById("pColor").value = p.color; document.getElementById("pPrice").value = p.price;
  document.getElementById("pActive").checked = p.active; document.getElementById("pMsg").textContent = "";
  markPalColor();
  document.querySelector(".main").scrollTop = 0;
}
function clearPrefix(){ editPrefix({ id: "", text: "", color: "#B6F24A", price: 0, active: true }); }
async function savePrefix(){
  const body = { id: document.getElementById("pId").value || null, text: document.getElementById("pText").value.trim(),
    color: document.getElementById("pColor").value.trim(), price: Number(document.getElementById("pPrice").value || 0),
    active: document.getElementById("pActive").checked };
  const msg = document.getElementById("pMsg");
  try { await api("/api/admin/prefixes", { method: "POST", body }); msg.textContent = "Сохранено ✓"; clearPrefix(); loadPrefixes(); }
  catch (e) { msg.textContent = e.message; }
}
async function grant(){
  const body = { who: document.getElementById("gWho").value.trim(), g: Number(document.getElementById("gG").value || 0), spins: Number(document.getElementById("gSpins").value || 0) };
  const msg = document.getElementById("gMsg");
  try { const r = await api("/api/admin/grant", { method: "POST", body }); msg.textContent = `Готово: ${r.nickname} — G +${r.g}, прокруток +${r.spins}`; }
  catch (e) { msg.textContent = e.message; }
}

if (!INIT) { document.getElementById("gate").style.display = "flex"; document.querySelector(".app").style.display = "none"; }
else { loadUsers(true); loadPrefixes(); }
</script>
</body></html>
